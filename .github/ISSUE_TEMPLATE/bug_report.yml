# Created by Harsh (@harsh-91) | Made in India
name: Bug report
description: Report a reproducible problem using synthetic or redacted data only.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Created by Harsh · Made in India 🇮🇳

        Never attach real statements, passwords, account numbers, API keys, database dumps, or screenshots containing financial data.
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: "1.1.0"
    validations:
      required: true
  - type: dropdown
    id: windows
    attributes:
      label: Windows version
      options:
        - Windows 11 x64
        - Windows 10 x64
        - Other or unsupported
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Use synthetic data and include the expected and actual result.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I removed all personal, banking, credential, and account data.
          required: true
