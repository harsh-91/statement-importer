name: Windows tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Compile Python sources
        run: python -m compileall -q app.py desktop.py setup_launcher.py statement_importer scripts tests
      - name: Test private report receiver
        run: node --test report-relay/test/index.test.js
      - name: Validate Claude Desktop bridge
        run: |
          node --check claude-desktop/server/index.js
          node --test claude-desktop/test/bridge.test.js
          python scripts/build_claude_extension.py
          python -c "from zipfile import ZipFile; z=ZipFile('dist/NeonLedger-ClaudeDesktop.mcpb'); assert set(z.namelist()) == {'manifest.json', 'server/index.js'}"
